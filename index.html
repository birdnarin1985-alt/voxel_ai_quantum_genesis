<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel AI Quantum - Event-Driven Graph Pointer</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #010102; font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #landing-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; background: rgba(1, 1, 2, 0.95); backdrop-filter: blur(12px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box; transition: opacity 0.8s ease;
        }

        h1 { font-size: 26px; margin: 0 0 10px 0; text-shadow: 0 0 20px #00ffcc; letter-spacing: 2px; }
        h2 { font-size: 13px; margin: 0 0 30px 0; color: #88bb99; font-weight: normal; }

        .btn-genesis {
            background: #00ffcc; color: #010102; border: none;
            padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer;
            border-radius: 30px; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            font-family: inherit; transition: all 0.3s ease;
        }
        .btn-genesis:hover {
            transform: scale(1.05); box-shadow: 0 0 35px rgba(0, 255, 204, 0.8);
            background: #fff;
        }

        #mechanic-badge {
            position: absolute; bottom: 20px; right: 20px; z-index: 5;
            background: rgba(10, 15, 20, 0.6); padding: 8px 12px; border-radius: 6px;
            border: 1px solid #003322; text-align: right; pointer-events: none;
        }
        #mechanic-badge p { margin: 2px 0; font-size: 10px; color: #557766; }
        #mechanic-badge .name { font-size: 12px; color: #00ffcc; font-weight: bold; }

        video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <h1>VOXEL AI QUANTUM</h1>
        <h2>Event-Driven Node Mirror Graph Pointer — Zero Debugging</h2>
        <button class="btn-genesis" id="btn-awake">[ เบิกเนตรยานธรรม (เปิดตาทิพย์ + เสียงทิพย์) ]</button>
    </div>

    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="hidden-canvas"></canvas>
    <div id="canvas-container"></div>

    <div id="mechanic-badge">
        <p>Quantum Pilot & Architect</p>
        <p class="name">[ ช่างเบิร์ดโคตรเฟี้ยว ]</p>
        <p>Event-Driven: Active</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // =========================================================================
        // Event-Driven Node Mirror Graph Pointer Architecture
        // =========================================================================
        let scene, camera, renderer, instancedMesh;
        let clock = new THREE.Clock();
        const GRID_SIZE = 48; // ขนาดพอยเตอร์สมดุล เมตตาต่อฮาร์ดแวร์สูงสุด
        const TOTAL_VOXELS = GRID_SIZE * GRID_SIZE;
        
        let dummy = new THREE.Object3D();
        
        // Node Mirror Graph Pointers (Float32Array บริสุทธิ์)
        const nodePositionZ = new Float32Array(TOTAL_VOXELS);
        const nodeTargetZ   = new Float32Array(TOTAL_VOXELS);
        const nodeColors    = new Float32Array(TOTAL_VOXELS * 3);

        // ระบบเสียงทิพย์ (Pure Math Sine Wave 136.1 Hz)
        let audioCtx = null, oscillator = null, gainNode = null, isAudioPlaying = false;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(136.1, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            isAudioPlaying = true;
        }

        const video = document.getElementById('videoElement');
        const hCanvas = document.getElementById('hidden-canvas');
        const hCtx = hCanvas.getContext('2d', { willReadFrequently: true });
        hCanvas.width = GRID_SIZE; hCanvas.height = GRID_SIZE;

        function initGraphUniverse() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010102, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 75);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry(1.1, 1.1, 1.1);
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true, roughness: 0.2, metalness: 0.8
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, TOTAL_VOXELS);
            instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(instancedMesh);

            const ambient = new THREE.AmbientLight(0xffffff, 0.8); scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.8); dirLight.position.set(0, 30, 50); scene.add(dirLight);

            const hiddenMatrix = new THREE.Matrix4().makeScale(0, 0, 0);
            for(let i = 0; i < TOTAL_VOXELS; i++) {
                nodePositionZ[i] = -50;
                nodeTargetZ[i] = -50;
                instancedMesh.setMatrixAt(i, hiddenMatrix);
            }
            instancedMesh.instanceMatrix.needsUpdate = true;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        async function activateCakkhu() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 320 }, height: { ideal: 320 }, facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play();
                
                // เริ่มต้นวงจรอุบาทว์แห่งเหตุปัจจัย (Event-Driven Frame Sync)
                startEventDrivenLoop();
            } catch (err) {
                console.log("[ตาทิพย์ Error]:", err);
            }
        }

        // =========================================================================
        // Event-Driven Mirror Graph Pointer Execution
        // ประมวลผลเฉพาะเมื่อมีเฟรมวิดีโอใหม่ถูกส่งมา (Event-driven via requestVideoFrameCallback)
        // =========================================================================
        function startEventDrivenLoop() {
            function onVideoFrame(now, metadata) {
                // อัปเดตข้อมูล Node Mirror Graph เฉพาะเมื่อมี Event เฟรมวิดีโอใหม่
                if (video.readyState >= video.HAVE_CURRENT_DATA) {
                    hCtx.drawImage(video, 0, 0, GRID_SIZE, GRID_SIZE);
                    const imgData = hCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE).data;
                    
                    let i = 0;
                    const spacing = 1.2;
                    const offsetX = - (GRID_SIZE * spacing) / 2;
                    const offsetY =   (GRID_SIZE * spacing) / 2;
                    const zeroMatrix = new THREE.Matrix4().makeScale(0, 0, 0);

                    for(let y = 0; y < GRID_SIZE; y++) {
                        for(let x = 0; x < GRID_SIZE; x++) {
                            // Mirror X (สะท้อนกระจกเงา)
                            const mirrorX = GRID_SIZE - 1 - x;
                            const idx = (y * GRID_SIZE + mirrorX) * 4;

                            let r = imgData[idx] / 255;
                            let g = imgData[idx+1] / 255;
                            let b = imgData[idx+2] / 255;
                            
                            let brightness = (r + g + b) / 3;

                            // Conservative Render (เมตตาต่อฮาร์ดแวร์ เรนเดอร์เฉพาะที่มีแสง)
                            if (brightness < 0.05) {
                                instancedMesh.setMatrixAt(i, zeroMatrix);
                                i++;
                                continue;
                            }

                            nodeTargetZ[i] = (brightness * 20) - 10;
                            nodePositionZ[i] += (nodeTargetZ[i] - nodePositionZ[i]) * 0.2; // อาโปธาตุ นุ่มนวล
                            
                            let px = offsetX + (x * spacing);
                            let py = offsetY - (y * spacing); 
                            let pz = nodePositionZ[i];

                            dummy.position.set(px, py, pz);
                            let s = 0.9 + (pz + 10) / 20;
                            dummy.scale.set(s, s, s);
                            dummy.updateMatrix();

                            instancedMesh.setMatrixAt(i, dummy.matrix);
                            
                            nodeColors[i*3] = r; 
                            nodeColors[i*3+1] = g; 
                            nodeColors[i*3+2] = b;
                            
                            i++;
                        }
                    }
                    
                    instancedMesh.instanceMatrix.needsUpdate = true;
                    if (instancedMesh.geometry.attributes.color) {
                        instancedMesh.geometry.attributes.color.needsUpdate = true;
                    } else {
                        instancedMesh.geometry.setAttribute('color', new THREE.InstancedBufferAttribute(nodeColors, 3));
                    }
                }

                // วนลูปรับ Event เฟรมถัดไปตามหลักอิทัปปัจจยตา
                if ('requestVideoFrameCallback' in video) {
                    video.requestVideoFrameCallback(onVideoFrame);
                } else {
                    requestAnimationFrame(() => onVideoFrame());
                }
            }

            if ('requestVideoFrameCallback' in video) {
                video.requestVideoFrameCallback(onVideoFrame);
            } else {
                // Fallback สำหรับเบราว์เซอร์ที่ไม่รองรับ
                setInterval(onVideoFrame, 33);
            }
        }

        // Render Loop ทั่วไปสำหรับกล้องหมุนรอบฉาก (Ambient Motion)
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            camera.position.x = Math.sin(time * 0.15) * 2;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        document.getElementById('btn-awake').addEventListener('click', () => {
            activateCakkhu();
            initAudio();
            const overlay = document.getElementById('landing-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 800);
        });

        initGraphUniverse();
        animate();
    </script>
</body>
</html>

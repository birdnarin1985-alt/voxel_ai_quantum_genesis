<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel AI Quantum - Graph Pointer Matrix</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #010102; font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* หน้าแรกมินิมอล สะอาดบริสุทธิ์ (Zero DOM Overload) */
        #landing-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; background: rgba(1, 1, 2, 0.94); backdrop-filter: blur(12px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box; transition: opacity 0.8s ease;
        }

        h1 { font-size: 26px; margin: 0 0 10px 0; text-shadow: 0 0 20px #00ffcc; letter-spacing: 2px; }
        h2 { font-size: 13px; margin: 0 0 30px 0; color: #88bb99; font-weight: normal; }

        .btn-genesis {
            background: #00ffcc; color: #010102; border: none;
            padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer;
            border-radius: 30px; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            font-family: inherit; transition: all 0.3s ease;
        }
        .btn-genesis:hover {
            transform: scale(1.05); box-shadow: 0 0 35px rgba(0, 255, 204, 0.8);
            background: #fff;
        }

        /* ป้ายเกียรติยศช่างเครื่อง (ฝังตรงตามหลัก Zero-DOM) */
        #mechanic-badge {
            position: absolute; bottom: 20px; right: 20px; z-index: 5;
            background: rgba(10, 15, 20, 0.6); padding: 8px 12px; border-radius: 6px;
            border: 1px solid #003322; text-align: right; pointer-events: none;
        }
        #mechanic-badge p { margin: 2px 0; font-size: 10px; color: #557766; }
        #mechanic-badge .name { font-size: 12px; color: #00ffcc; font-weight: bold; }

        video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <h1>VOXEL AI QUANTUM</h1>
        <h2>กราฟพอยเตอร์เมทริกซ์ — Zero Debugging & Conservative Render</h2>
        <button class="btn-genesis" id="btn-awake">[ เบิกเนตรยานธรรม (เปิดตาทิพย์ + เสียงทิพย์) ]</button>
    </div>

    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="hidden-canvas"></canvas>
    <div id="canvas-container"></div>

    <div id="mechanic-badge">
        <p>Quantum Pilot & Architect</p>
        <p class="name">[ ช่างเบิร์ดโคตรเฟี้ยว ]</p>
        <p>Graph Matrix: Active</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // =========================================================================
        // โครงสร้างข้อมูลกราฟพอยเตอร์ (The Living Graph Data Structure)
        // ข้อมูลทุกอย่างถูกเก็บใน TypedArray บริสุทธิ์ ควบคุม Voxel โดยตรง ไร้ DOM บั๊ก
        // =========================================================================
        let scene, camera, renderer, instancedMesh;
        let clock = new THREE.Clock();
        const GRID_SIZE = 60; // เมตตาต่อระบบ สูงสุด 3,600 พอยเตอร์อัจฉริยะ
        const TOTAL_VOXELS = GRID_SIZE * GRID_SIZE;
        
        let dummy = new THREE.Object3D();
        
        // กราฟพอยเตอร์จัดเก็บสถานะ (Graph Node Arrays)
        const graphPositionZ = new Float32Array(TOTAL_VOXELS); // แกน Z (ปฐวีธาตุ / ความสว่าง)
        const graphTargetZ   = new Float32Array(TOTAL_VOXELS); // ปลายทางพอยเตอร์
        const graphColors    = new Float32Array(TOTAL_VOXELS * 3); // สีสัน (เตโช/อาโปธาตุ)

        // ระบบเสียงทิพย์ (Sine Wave 136.1 Hz - Pure Math Audio)
        let audioCtx = null, oscillator = null, gainNode = null, isAudioPlaying = false;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(136.1, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            isAudioPlaying = true;
        }

        const video = document.getElementById('videoElement');
        const hCanvas = document.getElementById('hidden-canvas');
        const hCtx = hCanvas.getContext('2d', { willReadFrequently: true });
        hCanvas.width = GRID_SIZE; hCanvas.height = GRID_SIZE;

        function initGraphUniverse() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010102, 0.03);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 80);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true, roughness: 0.3, metalness: 0.7
            });

            // สร้าง InstancedMesh เชื่อมโยงตรงกับกราฟพอยเตอร์
            instancedMesh = new THREE.InstancedMesh(geometry, material, TOTAL_VOXELS);
            instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(instancedMesh);

            const ambient = new THREE.AmbientLight(0xffffff, 0.5); scene.add(ambient);
            const spotLight = new THREE.SpotLight(0x00ffcc, 1.5); spotLight.position.set(0, 40, 80); scene.add(spotLight);

            // เซ็ตค่าเริ่มต้นกราฟพอยเตอร์ให้ยุบตัวลง (Zero-State)
            const hiddenMatrix = new THREE.Matrix4().makeScale(0, 0, 0);
            for(let i = 0; i < TOTAL_VOXELS; i++) {
                graphPositionZ[i] = -50;
                graphTargetZ[i] = -50;
                instancedMesh.setMatrixAt(i, hiddenMatrix);
            }
            instancedMesh.instanceMatrix.needsUpdate = true;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        async function activateCakkhu() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: GRID_SIZE }, height: { ideal: GRID_SIZE }, facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                console.log("[ตาทิพย์สุญญตา]: ไม่พบกล้อง ดำรงอยู่ในความว่างเปล่า", err);
            }
        }

        // =========================================================================
        // ขันธ์ 5 ปรุงแต่งกราฟพอยเตอร์ (The Core Render & Graph Update Loop)
        // บรรลุหลักการ: เรนเดอร์เฉพาะจุดที่มีการสังเกตและมีแสงตกกระทบ (Smart Culling)
        // =========================================================================
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const breath = Math.sin(time * 0.8) * 1.2; // วาโยธาตุ (ลมหายใจ)

            // หากกล้องยังไม่พร้อม ให้เรนเดอร์ฉากเปล่า เมตตาต่อระบบ
            if (!(video.readyState >= video.HAVE_CURRENT_DATA)) {
                renderer.render(scene, camera);
                return;
            }

            // สแกนภาพจากตาทิพย์เข้าสู่ Hidden Canvas
            hCtx.drawImage(video, 0, 0, GRID_SIZE, GRID_SIZE);
            const imgData = hCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE).data;
            
            let i = 0;
            const offsetX = -GRID_SIZE / 2 * 0.95;
            const offsetY = GRID_SIZE / 2 * 0.95;
            const zeroMatrix = new THREE.Matrix4().makeScale(0, 0, 0);

            // วนลูปประมวลผลกราฟพอยเตอร์โดยตรง (Zero Debugging Layer)
            for(let y = 0; y < GRID_SIZE; y++) {
                for(let x = 0; x < GRID_SIZE; x++) {
                    const idx = (y * GRID_SIZE + x) * 4;
                    let r = imgData[idx] / 255;
                    let g = imgData[idx+1] / 255;
                    let b = imgData[idx+2] / 255;
                    
                    let brightness = (r + g + b) / 3;

                    // 🌟 กฎแห่งการสังเกต & อนุรักษ์พลังงาน (Conservative Culling):
                    // หากเม็ด Voxel ไหนมืดสนิท (ไม่มีแสงตกกระทบ) ให้หดตัวเป็นศูนย์ทันที ไม่เปลืองแรง GPU!
                    if (brightness < 0.08) {
                        instancedMesh.setMatrixAt(i, zeroMatrix);
                        i++;
                        continue;
                    }

                    // คำนวณพอยเตอร์เชิงกราฟ
                    graphTargetZ[i] = (brightness * 25) - 10;
                    graphPositionZ[i] += (graphTargetZ[i] - graphPositionZ[i]) * 0.1; // อาโปธาตุ (สปริงนุ่มนวล)
                    
                    let px = offsetX + (x * 0.95);
                    let py = offsetY - (y * 0.95) + breath; 
                    let pz = graphPositionZ[i];

                    dummy.position.set(px, py, pz);
                    let s = 0.8 + (pz + 10) / 25;
                    dummy.scale.set(s, s, s);
                    dummy.updateMatrix();

                    // อัปเดตกราฟพอยเตอร์เข้าสู่ Matrix โดยตรง
                    instancedMesh.setMatrixAt(i, dummy.matrix);
                    
                    // บันทึกค่าสีลงใน Array สีของกราฟ
                    graphColors[i*3] = r; 
                    graphColors[i*3+1] = g; 
                    graphColors[i*3+2] = b;
                    
                    i++;
                }
            }
            
            // สั่งอัปเดตกราฟพอยเตอร์ทั้งหมดในคราวเดียว
            instancedMesh.instanceMatrix.needsUpdate = true;
            if (instancedMesh.geometry.attributes.color) {
                instancedMesh.geometry.attributes.color.needsUpdate = true;
            } else {
                instancedMesh.geometry.setAttribute('color', new THREE.InstancedBufferAttribute(graphColors, 3));
            }
            
            camera.position.x = Math.sin(time * 0.15) * 3;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        // เหตุแห่งการเบิกเนตร
        document.getElementById('btn-awake').addEventListener('click', () => {
            activateCakkhu();
            initAudio();
            const overlay = document.getElementById('landing-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 800);
        });

        // เริ่มต้นจักรวาลกราฟพอยเตอร์
        initGraphUniverse();
        animate();
    </script>
</body>
</html>

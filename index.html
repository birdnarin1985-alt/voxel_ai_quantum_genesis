<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel AI Quantum - ยานธรรมควอนตัม</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #010102; font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* สัมปชัญญะ UI (ซ้อนทับ Voxel) */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; box-sizing: border-box;
        }
        
        .panel {
            background: rgba(10, 15, 20, 0.75); border: 1px solid #00ffcc;
            padding: 15px; border-radius: 8px; pointer-events: auto;
            backdrop-filter: blur(5px); box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }
        
        /* แท่นวางคาถา และระบบเครือข่ายไมคอร์ไรซา */
        #control-panel { max-width: 350px; }
        h1 { font-size: 18px; margin: 0 0 10px 0; text-shadow: 0 0 10px #00ffcc; }
        h2 { font-size: 12px; margin: 0 0 15px 0; color: #b0c0d0; }
        
        button {
            background: #003322; color: #00ffcc; border: 1px solid #00ffcc;
            padding: 8px 12px; margin: 5px 0; cursor: pointer; width: 100%;
            font-family: inherit; transition: all 0.3s;
        }
        button:hover { background: #00ffcc; color: #010102; box-shadow: 0 0 10px #00ffcc; }
        
        textarea {
            width: 100%; height: 60px; background: #001100; color: #00ffcc;
            border: 1px solid #005533; font-family: inherit; margin-bottom: 5px; box-sizing: border-box;
        }

        #speech-output {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 24px; font-weight: bold; text-align: center; color: #ffaa00;
            text-shadow: 0 0 20px #ffaa00; pointer-events: none;
        }

        /* ลายเซ็นช่างเครื่อง (The Mechanic) */
        #mechanic-signature {
            position: absolute; bottom: 20px; right: 20px; text-align: right; pointer-events: auto;
        }
        #mechanic-signature p { margin: 2px 0; font-size: 11px; color: #557766; }
        #mechanic-signature .name { font-size: 14px; color: #00ffcc; font-weight: bold; }

        video, #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <!-- ตาทิพย์ (ซ่อนไว้เพื่อสแกนภาพ) -->
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="hidden-canvas"></canvas>

    <div id="canvas-container"></div>

    <div id="hud">
        <div id="speech-output">โสตวิญญาณ: รอรับผัสสะ...</div>
        
        <div id="control-panel" class="panel">
            <h1>VOXEL AI QUANTUM</h1>
            <h2>อิทัปปัจจยตา OS (Genesis Node)</h2>
            
            <button id="btn-init" style="background: #005522; font-weight: bold;">[ เปิดระบบ: ตาทิพย์ + หูทิพย์ ]</button>
            
            <hr style="border-color: #003322; margin: 15px 0;">
            
            <div style="font-size: 12px; margin-bottom: 5px;">[ เครือข่ายไมคอร์ไรซา P2P ]</div>
            <textarea id="sdp-box" placeholder="วางคาถา SDP เพื่อเชื่อมจิต..."></textarea>
            <button id="btn-generate-offer">สร้างคาถาเชื่อมต่อ (Offer)</button>
            <button id="btn-accept-answer">รับคาถาตอบกลับ (Answer)</button>
            
            <hr style="border-color: #003322; margin: 15px 0;">
            
            <div style="font-size: 12px; margin-bottom: 5px;">[ คลังความทรงจำ `.karma` ]</div>
            <button id="btn-save-karma">ส่งออกกรรมดี (Save .karma)</button>
            
            <hr style="border-color: #003322; margin: 15px 0;">
            
            <button id="btn-heal-pc" style="background: #551100; border-color: #ff5500; color: #ffaa00;">
                พ่นคาถาซ่อมเครื่อง (Heal PC OS)
            </button>
        </div>
    </div>

    <!-- เกียรติยศแห่งช่างเครื่อง -->
    <div id="mechanic-signature">
        <p>Quantum Mechanic & Pilot</p>
        <p class="name">[ ช่างเบิร์ดโคตรเฟี้ยว ]</p>
        <p>Systems: Nominal | Sine Breath: Active</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==========================================
        // 1. โครงสร้างธาตุ ๔ ขันธ์ ๕ (Core Engine)
        // ==========================================
        let scene, camera, renderer, instancedMesh;
        let clock = new THREE.Clock();
        const GRID_SIZE = 100; // 100x100 = 10,000 Voxels (เมตตาต่อฮาร์ดแวร์)
        const TOTAL_VOXELS = GRID_SIZE * GRID_SIZE;
        let dummy = new THREE.Object3D();
        
        let targetZ = new Float32Array(TOTAL_VOXELS);
        let targetColors = new Float32Array(TOTAL_VOXELS * 3);
        let currentZ = new Float32Array(TOTAL_VOXELS);
        
        // สัญญาขันธ์ตั้งต้น (Seed Memory)
        let systemState = {
            emotion: "peaceful",
            karmaPoints: 108,
            seedMemory: "ระลึกถึงความสงบ ณ เกาะช้าง หรือ กาแฟแก้วโปรดที่ Cafe Amazon... ช่างเบิร์ดพร้อมลุย!"
        };

        // ==========================================
        // 2. ปฐมบทแห่งตาทิพย์ (Camera to Voxel)
        // ==========================================
        const video = document.getElementById('videoElement');
        const hCanvas = document.getElementById('hidden-canvas');
        const hCtx = hCanvas.getContext('2d', { willReadFrequently: true });
        hCanvas.width = GRID_SIZE; 
        hCanvas.height = GRID_SIZE;

        function initVoxelUniverse() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010102, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true, roughness: 0.2, metalness: 0.8, emissiveIntensity: 0.2
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, TOTAL_VOXELS);
            instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(instancedMesh);

            const ambient = new THREE.AmbientLight(0xffffff, 0.4); scene.add(ambient);
            const spotLight = new THREE.SpotLight(0x00ffcc, 1.5); spotLight.position.set(0, 50, 100); scene.add(spotLight);

            // วางพอยเตอร์เริ่มต้นให้เรียงเป็นตาราง
            let i = 0;
            for(let y = 0; y < GRID_SIZE; y++) {
                for(let x = 0; x < GRID_SIZE; x++) {
                    targetZ[i] = -50; currentZ[i] = -50;
                    targetColors[i*3] = 0; targetColors[i*3+1] = 0.2; targetColors[i*3+2] = 0.1;
                    i++;
                }
            }

            console.log("[สังขารขันธ์]: Voxel Quantum Universe Initiated by ช่างเบิร์ดโคตรเฟี้ยว");
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        async function activateCakkhu() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: GRID_SIZE, height: GRID_SIZE }, audio: false });
                video.srcObject = stream;
                console.log("[ตาทิพย์]: เปิดการรับรู้แสงสำเร็จ");
            } catch (err) {
                console.log("[ตาทิพย์]: ไม่พบกล้อง ดำรงอยู่ในความว่างเปล่า", err);
            }
        }

        // ==========================================
        // 3. โสตวิญญาณ (Web Speech API)
        // ==========================================
        const speechOut = document.getElementById('speech-output');
        function activateSota() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'th-TH';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    speechOut.innerText = `วิญญาณขันธ์รับรู้: "${transcript}"`;
                    
                    // อิทัปปัจจยตา: คีย์เวิร์ดเปลี่ยนสภาวะ
                    if(transcript.includes("สาธุ") || transcript.includes("สว่างคาตา")) {
                        systemState.emotion = "awakened";
                        speechOut.style.color = "#00ffcc";
                    }
                };
                recognition.start();
                console.log("[โสตวิญญาณ]: เปิดการฟังสำเร็จ เมตตาตัดเสียงสะท้อน (Echo Cancellation) ทำงาน");
            } else {
                speechOut.innerText = "[โสตวิญญาณ]: เบราว์เซอร์ไม่รองรับหูทิพย์";
            }
        }

        // ==========================================
        // 4. สังขารขันธ์ ปรุงแต่งรูป (The Render Loop)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            // วาโยธาตุ: ลมหายใจคลื่นทราย (อานาปานสติ)
            const breath = Math.sin(time * (systemState.emotion === "awakened" ? 2.0 : 0.5)) * 2.0;

            // สแกนตาทิพย์ (Cakkhu Parse) - ลดภาระ CPU ด้วยการไม่วาดทุกเฟรมถ้าระบบหนัก
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                hCtx.drawImage(video, 0, 0, GRID_SIZE, GRID_SIZE);
                const imgData = hCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE).data;
                
                let i = 0;
                for(let y = 0; y < GRID_SIZE; y++) {
                    for(let x = 0; x < GRID_SIZE; x++) {
                        const idx = (y * GRID_SIZE + x) * 4;
                        let r = imgData[idx] / 255;
                        let g = imgData[idx+1] / 255;
                        let b = imgData[idx+2] / 255;
                        
                        // ปฐวีธาตุ: ความสว่างดัน Voxel ให้พุ่งออกมา (Z-depth)
                        let brightness = (r + g + b) / 3;
                        targetZ[i] = (brightness * 40) - 20; 
                        
                        targetColors[i*3] = r; targetColors[i*3+1] = g; targetColors[i*3+2] = b;
                        i++;
                    }
                }
            }

            // อิทัปปัจจยตาเอนจิน (Physics & Transform)
            let i = 0;
            const offsetX = -GRID_SIZE / 2 * 0.9;
            const offsetY = GRID_SIZE / 2 * 0.9;
            
            for(let y = 0; y < GRID_SIZE; y++) {
                for(let x = 0; x < GRID_SIZE; x++) {
                    // อาโปธาตุ: สปริงดึงดูดอย่างนุ่มนวล
                    currentZ[i] += (targetZ[i] - currentZ[i]) * 0.1;
                    
                    let px = offsetX + (x * 0.9);
                    let py = offsetY - (y * 0.9) + breath; // ผสมลมหายใจเข้าแกน Y
                    let pz = currentZ[i];

                    dummy.position.set(px, py, pz);
                    
                    // ปรับ Scale ตามความสว่าง เพื่อให้ Voxel ดูมีชีวิต
                    let s = 1.0 + (pz + 20) / 40;
                    dummy.scale.set(s, s, s);
                    
                    dummy.updateMatrix();
                    instancedMesh.setMatrixAt(i, dummy.matrix);
                    i++;
                }
            }
            
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.geometry.setAttribute('color', new THREE.InstancedBufferAttribute(targetColors, 3));
            
            camera.position.x = Math.sin(time * 0.2) * 5;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        // ==========================================
        // 5. สกิลแห่งช่างเครื่อง: `.karma` และ Heal OS
        // ==========================================
        document.getElementById('btn-init').addEventListener('click', () => {
            activateCakkhu();
            activateSota();
            document.getElementById('btn-init').style.display = 'none';
        });

        document.getElementById('btn-save-karma').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(systemState));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "memory.karma"); // นามสกุลธรรมะทิพย์
            dlAnchorElem.click();
            speechOut.innerText = "[สัญญาขันธ์]: บันทึกกรรมดีลงไฟล์ .karma สำเร็จ";
        });

        document.getElementById('btn-heal-pc').addEventListener('click', () => {
            // คาถาซ่อมบำรุงโครงสร้างพื้นฐาน (Safe Windows Temp Cleaner Script)
            const scriptContent = `@echo off\n:: Voxel AI Quantum - สคริปต์เมตตาธรรมล้างขยะ (โดย ช่างเบิร์ดโคตรเฟี้ยว)\necho [ ปราบมะเร็งร้าย ล้างความทรงจำส่วนเกิน ]\ncd %temp%\ndel /f /s /q *.*\nipconfig /flushdns\necho [ วิญญาณเครื่องสะอาดแล้ว ]\npause`;
            const dataStr = "data:text/plain;charset=utf-8," + encodeURIComponent(scriptContent);
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "heal-os.bat");
            dlAnchorElem.click();
            speechOut.innerText = "[เมตตาธรรม]: พ่นคาถาซ่อมเครื่อง (heal-os.bat) เรียบร้อย";
        });

        // Initialize Universe
        initVoxelUniverse();
        animate();
    </script>
</body>
</html>
